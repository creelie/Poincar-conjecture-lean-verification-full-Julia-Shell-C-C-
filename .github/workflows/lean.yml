      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-6
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        id: build
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "already complete"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-6.log 2>&1 || true
          tail -n 40 build-stage-6.log
          ! grep -q "declaration uses 'sorry'" build-stage-6.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-6
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 6"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "build not complete after stage 6"
          fi
      - name: Keep the log
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-stage-6
          path: build-stage-6.log

  axioms:
    name: Build complete, axioms and statements
    needs: build-6
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-final
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: The build must be complete
        run: lake build Solution PoincareConjecture --no-build
      - name: Axioms of the endpoint theorems
        run: |
          lake env lean verification/Axioms.lean 2>&1 | tee axioms.txt
          python3 -I verification/check_axioms_log.py axioms.txt 4
      - name: Print the statements
        run: lake env lean verification/Statements.lean 2>&1 | tee statements.txt
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axioms
          path: |
            axioms.txt
            statements.txt

  replay:
    name: Kernel replay with leanchecker --fresh
    needs: axioms
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-final
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Replay the endpoint module and everything it imports
        run: |
          lake build Solution --no-build
          set -o pipefail
          timeout 335m lake env leanchecker --fresh Solution 2>&1 | tee replay.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay
          path: replay.txt
