      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-2
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        id: build
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "already complete"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-2.log 2>&1 || true
          tail -n 40 build-stage-2.log
          ! grep -q "declaration uses 'sorry'" build-stage-2.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-2
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 2"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "build not complete after stage 2"
          fi
      - name: Keep the log
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-stage-2
          path: build-stage-2.log

  build-3:
    name: Lean build, stage 3 of 6
    needs: build-2
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-3
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        id: build
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "already complete"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-3.log 2>&1 || true
          tail -n 40 build-stage-3.log
          ! grep -q "declaration uses 'sorry'" build-stage-3.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-3
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 3"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "build not complete after stage 3"
          fi
      - name: Keep the log
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-stage-3
          path: build-stage-3.log

  build-4:
    name: Lean build, stage 4 of 6
    needs: build-3
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-4
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        id: build
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "already complete"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-4.log 2>&1 || true
          tail -n 40 build-stage-4.log
          ! grep -q "declaration uses 'sorry'" build-stage-4.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-4
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 4"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "build not complete after stage 4"
          fi
      - name: Keep the log
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-stage-4
          path: build-stage-4.log

  build-5:
    name: Lean build, stage 5 of 6
    needs: build-4
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-5
          restore-keys: |
