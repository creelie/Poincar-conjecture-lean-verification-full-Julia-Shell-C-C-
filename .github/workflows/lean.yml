          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-5.log 2>&1 || true
          tail -n 40 build-stage-5.log
          ! grep -q "declaration uses 'sorry'" build-stage-5.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-5
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 5"
