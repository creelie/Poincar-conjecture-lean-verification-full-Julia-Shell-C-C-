name: lean

# The proof is about 3.06 million lines of Lean, more than one GitHub job (six hours) may be
# able to compile.  The build therefore runs as a chain of stages: each stage restores the
# compiled files of the previous stage from the Actions cache, builds for up to five and a
# half hours, and saves what it compiled.  A stage that finds everything built does nothing.
# After the chain, `axioms` checks that the build is complete and prints the axioms of the
# two endpoint theorems, and `replay` re-checks every declaration of the endpoint module and
# all it imports (Mathlib included) with leanchecker --fresh.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Scan, statements, C, C++, Julia and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - name: Install Regina
        run: python3 -m pip install "regina==7.4.1"
      - name: Run the checks
        run: checks/run_all.sh

  build-1:
    name: Lean build, stage 1 of 6
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the compiled files
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-1
          restore-keys: |
            poincare-build-${{ github.run_id }}-
            poincare-build-
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        id: build
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "already complete"; echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          timeout 320m lake build Solution PoincareConjecture > build-stage-1.log 2>&1 || true
          tail -n 40 build-stage-1.log
          ! grep -q "declaration uses 'sorry'" build-stage-1.log
      - name: Save the compiled files
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: poincare-build-${{ github.run_id }}-stage-1
      - name: Status
        id: status
        if: always()
        run: |
          if lake build Solution PoincareConjecture --no-build >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"; echo "build complete after stage 1"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "build not complete after stage 1"
          fi
      - name: Keep the log
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-stage-1
          path: build-stage-1.log

  build-2:
    name: Lean build, stage 2 of 6
    needs: build-1
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
