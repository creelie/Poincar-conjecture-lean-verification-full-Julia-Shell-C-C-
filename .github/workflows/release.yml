name: release

# Run by hand from the Actions tab (or the API) after the PR is merged:
# it tags the chosen commit and publishes a GitHub release with the notes in
# .github/RELEASE_NOTES.md. Zenodo archives the release and mints a DOI if
# the repository is switched on at https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the record
        run: |
          for f in VERIFICATION.md verification/Axioms.lean verification/scan.sh checks/run_all.sh; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          python3 -m json.tool .zenodo.json > /dev/null
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG: the Poincaré formalization, built and checked" \
            --notes-file .github/RELEASE_NOTES.md
